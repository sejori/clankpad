apiVersion: v1
kind: Service
metadata:
  name: clankpad
spec:
  selector: {app.kubernetes.io/name: clankpad}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clankpad
spec:
  # Single replica: the aggregator is in-process and rebuilds on every write.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: clankpad}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clankpad}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clankpad
          image: ghcr.io/sejori/clankpad
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: REDIS_URL, value: redis://clankpad-redis:6379}
            - {name: CLANKPAD_IDENTITY_MODE, value: tailscale}
            - {name: LLM_BASE_URL, value: https://api.doubleword.ai/v1}
            - {name: LLM_MODEL, value: Qwen/Qwen3.5-35B-A3B-FP8}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: clankpad, key: LLM_API_KEY, optional: true}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
