apiVersion: v1
kind: Service
metadata:
  name: clankpad-redis
spec:
  selector: {app.kubernetes.io/name: clankpad-redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clankpad-redis
spec:
  serviceName: clankpad-redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: clankpad-redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: clankpad-redis}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          # AOF so two weeks of logs survive a pod restart.
          args: ["--appendonly", "yes", "--save", "", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
