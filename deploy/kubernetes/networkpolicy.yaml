# Identity comes from a header, so clankpad must be reachable only through the
# Tailscale operator's proxy (namespace `tailscale`). Requires a CNI that
# enforces NetworkPolicy (on EKS: VPC CNI with network policy enabled).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clankpad
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: clankpad}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: tailscale}
      ports: [{port: 8080}]
    # kubelet probes come from the node and are not subject to this policy on VPC CNI.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clankpad-redis
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: clankpad-redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: clankpad}
      ports: [{port: 6379}]
